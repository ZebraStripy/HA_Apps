name: "Dashboard Screenshot"
version: "1.1.0"
slug: dashboard_screenshot
description: "Periodically screenshots Home Assistant dashboards and saves the images to /config/www/Screenshots"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
map:
  - type: homeassistant_config
    path: /homeassistant
    read_only: false
options:
  token: null
  snapshots:
    - url: "http://homeassistant:8123/lovelace/0"
      filename: "screenshot.png"
      width: 1280
      height: 800
      x: 0
      y: 0
      wait: 5
      interval: 60
schema:
  token: password
  snapshots:
    - url: url
      filename: "match(^[A-Za-z0-9_-]+\\.png$)"
      width: "int(100,4000)"
      height: "int(100,10000)"
      x: "int(0,10000)"
      y: "int(0,10000)"
      wait: "int(0,120)"
      interval: "int(5,86400)"
