configuration:
  token:
    name: Long-lived access token
    description: Created on your Home Assistant profile page (Security tab). Used to log in to every dashboard.
  snapshots:
    name: Snapshots
    description: One entry per screenshot to take. Snapshots are captured one at a time, each on its own interval.
    fields:
      url:
        name: Dashboard URL
        description: Full URL of the dashboard to capture, e.g. http://homeassistant:8123/lovelace/0
      filename:
        name: Filename
        description: Name of the PNG file saved in config/www/Screenshots (letters, digits, _ and - only, ending in .png). Must be different for every snapshot.
      width:
        name: Viewport width
        description: Width in pixels of the browser viewport.
      height:
        name: Viewport height
        description: Height in pixels of the browser viewport.
      x:
        name: Crop X
        description: Left edge of the crop square, in pixels from the left of the captured page (0 = left edge).
      y:
        name: Crop Y
        description: Top edge of the crop square, in pixels from the top of the captured page (0 = top edge).
      wait:
        name: Wait after load
        description: Seconds to wait after the page loads before capturing, so cards can finish rendering.
      interval:
        name: Refresh interval
        description: Seconds between screenshots of this snapshot.
